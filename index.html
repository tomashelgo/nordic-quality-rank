<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --baseline: #c3c2b7; --ring: rgba(11,11,11,0.10);
    --accent: #2a78d6; --accent-ink: #ffffff; --err: #d03b3b;
  }
  @media (prefers-color-scheme: dark) { :root {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --baseline: #383835; --ring: rgba(255,255,255,0.10); --accent: #3987e5;
  } }
  :root[data-theme="dark"] {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --baseline: #383835; --ring: rgba(255,255,255,0.10); --accent: #3987e5;
  }
  :root[data-theme="light"] {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --baseline: #c3c2b7; --ring: rgba(11,11,11,0.10); --accent: #2a78d6;
  }
  .gate-body { min-height: 96vh; display: grid; place-items: center;
    background: var(--page); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px;
    padding: 30px 30px 26px; width: min(360px, 90vw); }
  .card h1 { font-size: 17px; margin: 0 0 4px; font-weight: 650; }
  .card p { margin: 0 0 18px; color: var(--ink-2); font-size: 13.5px; }
  .card form { display: flex; flex-direction: column; gap: 10px; }
  .card input { font: inherit; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--baseline); background: var(--page); color: var(--ink); }
  .card input:focus-visible, .card button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card button { font: inherit; font-weight: 600; padding: 10px 12px; border-radius: 8px;
    border: none; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .card button[disabled] { opacity: .6; cursor: wait; }
  .msg { min-height: 18px; font-size: 13px; color: var(--err); }
</style>
